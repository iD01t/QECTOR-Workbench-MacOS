[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qector-workbench"
version = "3.5.0"
description = "Professional QEC analysis suite built on qector-decoder-v3"
readme = "README_v3.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
authors = [{name = "Guillaume Lessard", email = "dev@qector.app"}]
keywords = ["quantum", "error-correction", "decoder", "qec", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "qector-decoder-v3>=0.6.2",
    "customtkinter>=5.2.0",
    "numpy>=1.24",
    "scipy>=1.9",
    "matplotlib>=3.8",
    "Pillow>=9.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "bandit>=1.7",
    "pip-audit>=2.6",
    "mypy>=1.5",
    "ruff>=0.1",
    "pyinstaller>=6.0",
]

[project.scripts]
qector = "app:main"

[project.gui-scripts]
qector-gui = "app:main"

[tool.setuptools]
py-modules = [
    "app",
    "backend",
    "state",
    "theme",
    "utils",
    "logger",
    "console",
    "version",
    "doc_generator",
    "auto_updater",
    "threading_utils",
    "results_tracker",
    "hardware_routing",
    "mcp_server",
    "mcp_resources",
    "dialogs",
    "code_explorer_tab",
    "decoder_lab_tab",
    "benchmark_tab",
    "batch_streaming_tab",
    "hardware_tab",
    "documentation_tab",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["dist", "build", ".venv", "__pycache__"]
