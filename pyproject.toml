[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "qector-workbench"
version = "3.2.0"
description = "Professional QEC analysis suite built on qector-decoder-v3"
readme = "README_v3.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
authors = [{name = "Guillaume Lessard", email = "dev@qector.app"}]
keywords = ["quantum", "error-correction", "decoder", "qec", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "qector-decoder-v3>=0.5.8",
    "customtkinter>=6.0.0",
    "matplotlib>=3.8",
    "numpy>=1.24.0",
    "Pillow>=9.0.0",
    "scipy>=1.9.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "bandit>=1.7",
    "safety>=2.3",
    "mypy>=1.5",
    "ruff>=0.1",
    "pyinstaller>=6.0",
]

[project.scripts]
qector = "app:main"

[project.gui-scripts]
qector-gui = "app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "backend*", "ui*", "server*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "EULA.txt", "icon.png", "QectorWorkbench.spec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["dist", "build", ".venv", "__pycache__"]
