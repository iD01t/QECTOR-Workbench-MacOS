# Ready-to-use GitHub Actions workflow to build BOTH macOS slices.
# Copy to .github/workflows/macos-build.yml at the repo root to enable it.
#
# macos-14 is Apple Silicon (arm64); macos-13 is Intel (x86_64).  The Intel job
# builds the qector-decoder-v3 x86_64 wheel from the published sdist (the GitHub
# macOS runners ship the Rust toolchain), drops it into Mac/wheels/, then runs
# the same build_macos.sh used locally.
name: macOS build (arm64 + Intel)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.arch }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14   # Apple Silicon
            arch: arm64
          - runner: macos-13   # Intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Intel backend wheel from sdist (x86_64 only)
        if: matrix.arch == 'x86_64'
        run: |
          python -m pip install --upgrade pip wheel
          # The macos-13 runner is native x86_64 with Rust preinstalled, so this
          # produces a macosx x86_64 wheel that build_macos.sh will prefer.
          pip wheel "qector-decoder-v3==0.6.6" --no-binary qector-decoder-v3 -w Mac/wheels/
          ls -l Mac/wheels/

      - name: Build .app + .dmg
        working-directory: Mac
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh --arch ${{ matrix.arch }} --test

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QectorWorkbench-macos-${{ matrix.arch }}
          path: |
            Mac/dist/*.dmg
          retention-days: 30
