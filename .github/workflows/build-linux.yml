name: Build Linux AppImage

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run pytest before packaging"
        required: false
        default: true
        type: boolean
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build Linux AppImage on ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build AppImage using Docker
        run: |
          chmod +x Linux/compile.sh
          cd Linux
          # We use the docker build which gives a reproducible AppImage
          ./compile.sh --docker

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: QectorWorkbench-Linux-x86_64
          path: |
            Linux/dist/*.AppImage
          retention-days: 30
          if-no-files-found: error
