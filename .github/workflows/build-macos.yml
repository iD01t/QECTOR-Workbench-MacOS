name: Build macOS app

# Why this exists instead of a local VM:
#
# macOS cannot legally be virtualised on non-Apple hardware (Apple's software
# licence permits virtualisation only on Apple-branded machines), and
# PyInstaller cannot cross-compile: a .app/.dmg must be produced on macOS, by
# macOS tooling (iconutil, hdiutil, sips, codesign).  GitHub's macOS runners are
# genuine Apple hardware, so this workflow is the supported way to produce the
# macOS artifact for a release from a Windows or Linux desktop.
#
# Trigger it by hand from the Actions tab (Run workflow), or on a tag push.
# The .dmg and .app land as downloadable build artifacts.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target slice"
        required: true
        default: "arm64"
        type: choice
        options: ["arm64", "x86_64"]
      run_tests:
        description: "Run pytest before packaging"
        required: false
        default: true
        type: boolean
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }} on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 and newer are Apple Silicon; macos-13 is the Intel runner.
          # The decoder ships an arm64 wheel on PyPI but no x86_64 wheel, so an
          # Intel build needs one dropped into wheels/ first (see wheels/README).
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-13
    runs-on: ${{ matrix.runner }}
    env:
      PIP_NO_CACHE_DIR: "1"
      MPLBACKEND: Agg
      QECTOR_SILENT: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Report build inputs
        run: |
          echo "runner arch : $(uname -m)"
          echo "target slice: ${{ matrix.arch }}"
          python -c "import sys; sys.path.insert(0,'.'); import version; print('workbench :', version.WORKBENCH_VERSION); print('backend   :', version.BACKEND_VERSION)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        # Skipped only when explicitly deselected on a manual run; a tag build
        # always tests, because that is the build people actually download.
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.run_tests
        run: python -m pytest -q

      - name: Build .app and .dmg
        run: |
          chmod +x Mac/build_macos.sh
          cd Mac
          ./build_macos.sh --arch ${{ matrix.arch }}

      - name: Verify the frozen app
        run: |
          set -e
          APP="Mac/dist/QectorWorkbench.app/Contents/MacOS/QectorWorkbench"
          test -x "$APP" || { echo "frozen binary missing at $APP"; ls -R Mac/dist | head -40; exit 1; }
          echo "--- decoder selftest ---"
          "$APP" --decoder-selftest
          echo "--- CLI version ---"
          "$APP" --cli version

      - name: Checksum the artifacts
        run: |
          cd Mac/dist
          shasum -a 256 *.dmg > SHA256SUMS.txt || true
          cat SHA256SUMS.txt || true
          ls -lh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QectorWorkbench-macOS-${{ matrix.arch }}
          path: |
            Mac/dist/*.dmg
            Mac/dist/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
