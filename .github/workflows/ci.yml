name: Main CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    name: Lint, typecheck, security
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    env:
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install project + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff lint
        run: ruff check .
      - name: Bandit security scan
        run: bandit -r . -x ./build,./dist,./.venv,./__pycache__ -ll
      - name: Safety dependency audit
        run: safety check --full-report
      - name: mypy strict typecheck
        run: mypy .

  test:
    name: pytest ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: lint-and-typecheck
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.11"]
        os: [ubuntu-latest, windows-latest]
    env:
      PIP_NO_CACHE_DIR: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install project + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run pytest with coverage
        run: pytest --cov=. --cov-report=xml -q
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml

  build-windows:
    name: PyInstaller EXE (Windows)
    needs: lint-and-typecheck
    runs-on: windows-latest
    env:
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install project + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install pyinstaller
      - name: Build EXE with PyInstaller
        run: pyinstaller -y QectorWorkbench.spec
      - name: Package release asset
        run: |
          powershell -NoProfile -Command "Compress-Archive -Path 'dist\QectorWorkbench\*' -DestinationPath 'release_assets\QectorWorkbench-${{ github.run_number }}.zip'"
      - name: Compute checksums
        run: |
          powershell -NoProfile -Command "Get-FileHash 'release_assets\QectorWorkbench-${{ github.run_number }}.zip' -Algorithm SHA256 | Format-List"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QectorWorkbench-Windows-${{ github.run_number }}
          path: release_assets/QectorWorkbench-${{ github.run_number }}.zip
          retention-days: 30
